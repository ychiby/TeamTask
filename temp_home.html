<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeamTask Projects</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; background: #f5f7fa; margin:0; padding:0; color:#333; }
    h1 { text-align:center; padding:30px 0; margin:0; font-size:2em; color:#1a1a1a; }
    .table-container { max-width:900px; margin:0 auto; background:#fff; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.05); padding:20px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { padding:14px 12px; text-align:left; border-bottom:1px solid #eee; }
    th { background:#f2f4f6; font-weight:600; color:#444; }
    tr:hover { background:#f9fbfd; }
    .status-message { text-align:center; padding:40px; color:#666; font-size:1.1em; }
    .loader { border:4px solid #eee; border-top:4px solid #3498db; border-radius:50%; width:30px; height:30px; animation:spin 1s linear infinite; margin:20px auto; }
    @keyframes spin { 0%{ transform:rotate(0deg); } 100%{ transform:rotate(360deg); } }
    @media (max-width:600px){ th,td{font-size:0.85em;padding:10px 8px;} h1{font-size:1.5em;} }
    form { margin-top:20px; display:flex; flex-wrap:wrap; gap:10px; }
    input, select { padding:8px; flex:1; min-width:120px; border-radius:6px; border:1px solid #ccc; }
    button { padding:8px 16px; border:none; border-radius:6px; background:#3498db; color:#fff; cursor:pointer; }
    button:hover { background:#2980b9; }
  </style>
</head>
<body>
  <h1>TeamTask Projects</h1>
  <div class="table-container">
    <div id="loading" class="status-message">
      <div class="loader"></div>
      <p>Loading projects...</p>
    </div>

    <table id="projects-table" style="display:none;">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Description</th>
          <th>Status</th>
          <th>Created At</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>

    <!-- Add Project Form -->
    <form id="add-project-form">
      <input type="text" name="name" placeholder="Project Name" required />
      <input type="text" name="description" placeholder="Description" required />
      <select name="status" required>
        <option value="" disabled selected>Status</option>
        <option value="active">Active</option>
        <option value="completed">Completed</option>
        <option value="paused">Paused</option>
      </select>
      <button type="submit">Add Project</button>
    </form>
  </div>
  <!-- shared frontend behavior -->
  <script src="/app.js"></script>
</body>
</html>
